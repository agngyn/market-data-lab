[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlab"
version = "0.1.0"
description = "Multi-source market data pipeline and data quality lab (Yahoo / FMP / Polygon reconciliation, corporate-action adjustment, automated DQ report)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Andy Nguyen"}]
urls = {Repository = "https://github.com/agngyn/market-data-lab"}
dependencies = [
  "pandas>=2.1", "numpy>=1.24", "pyarrow>=12", "yfinance>=0.2.40",
  "requests>=2.31", "tenacity>=8.2", "pandera>=0.18", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat"]

[project.scripts]
mdlab = "mdlab.pipeline:main"

[tool.setuptools.packages.find]
include = ["mdlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
